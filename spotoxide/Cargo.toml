[package]
name = "spotoxide"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = {version = "0.8.9", features = ["macros", "tokio"]}
chrono = {version = "0.4.45", features= ["serde"]}
dotenvy = "0.15.7"
jsonwebtoken = "11.1.0"
peak_alloc = "0.3.0"
random_name_generator = "0.4.0"
rmpv = {version = "1.3.1", features = ["with-serde"]}
serde = {version = "1.0.229", features = ["derive"]}
socketioxide = {version = "0.18.7", features = ["v4","state", "tracing", "extensions"]}
spotify-rs = "0.4.1"
thiserror = "2.0.21"
# spotify-rs = {git  = "https://github.com/JayJayArr/spotify-rs.git"}
tokio = {version = "1.53.1", features = ["rt-multi-thread", "signal"]}
tokio-cron-scheduler = {version = "0.15.1", features = ["tracing-subscriber", "english"]}
tokio-util = {version = "0.7.19" , features = ["rt"]}
tower = {version="0.5.3", features= ["limit", "buffer"]}
tower-http = {version = "0.7.1", features = ["cors"]}
tracing = "0.1.44"
tracing-subscriber = {version = "0.3.23", features = ["env-filter"]}
